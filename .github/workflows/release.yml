name: Release

# Runs when the pull request from Prepare release is merged: publishes that
# version to crates.io, tags it, and attaches the macOS binary. Ordinary merges
# do not match, because the branch prefix is release-plz's own.
#
# workflow_dispatch is here to retry a run that failed part way through;
# publishing a version that already exists on crates.io is a no-op.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io and tag
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release-plz-'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[{}]')[0].tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit on the default branch, which carries the bump.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binary:
    name: Attach the macOS binary
    needs: publish
    if: needs.publish.outputs.releases_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
      # One archive covering Apple Silicon and Intel.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: muta
          target: universal-apple-darwin
          archive: $bin-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.publish.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
