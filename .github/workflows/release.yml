name: Release

# Runs on every push to main. release-please keeps the release PR current; when a
# merge cuts a release it bumps the version, writes CHANGELOG.md, creates the
# vX.Y.Z tag and publishes the GitHub release. This same run then publishes to
# crates.io and attaches the macOS binary.
#
# workflow_dispatch is here to retry a run that failed part way through;
# publishing a version that already exists on crates.io is a no-op.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token rather than GITHUB_TOKEN or a PAT: GITHUB_TOKEN-created
      # events don't trigger workflows (so build-and-test.yml wouldn't run on the
      # release PR), and a PAT would author the PR as its owner, who can't
      # approve it.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  publish:
    name: Publish to crates.io
    needs: release-please
    # Only when this run actually cut a release.
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    # macOS, not Linux: cargo publish verifies by compiling, and this crate
    # binds utun, SCDynamicStore and launchd.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binary:
    name: Attach the macOS binary
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # One archive covering Apple Silicon and Intel.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: muta
          target: universal-apple-darwin
          archive: $bin-$target
          checksum: sha256
          locked: true
          ref: refs/tags/${{ needs.release-please.outputs.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
